<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="シンプルで高速なQRコードリーダー">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <title>QR Reader</title>
</head>
<body>
  <main class="app">
    <section id="scannerScreen" class="screen scanner-screen">
      <video id="camera" class="camera" autoplay playsinline muted></video>
      <canvas id="canvas" hidden></canvas>
      <div class="camera-shade" aria-hidden="true"></div>
      <div class="ui-layer">
        <header class="topbar">
          <div class="brand"><span class="brand-mark">⌗</span><span>QR Reader</span></div>
          <button id="cameraSwitch" class="glass-button" type="button" aria-label="カメラを切り替える" hidden>↻</button>
        </header>
        <div class="scan-center">
          <div class="scan-frame" aria-label="QRコードをこの枠内に合わせてください">
            <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
            <div class="scan-line"></div>
          </div>
          <h1>QRコードをスキャン</h1>
          <p>コードを枠内に合わせてください</p>
        </div>
        <div class="bottom-status"><span id="status">カメラを起動しています…</span></div>
      </div>
    </section>

    <section id="messageScreen" class="screen message-screen hidden">
      <div class="message-card">
        <div id="messageIcon" class="message-icon">◎</div>
        <p class="eyebrow">CAMERA ACCESS</p>
        <h1 id="messageTitle">カメラを使用します</h1>
        <p id="messageText">QRコードを読み取るため、カメラへのアクセスを許可してください。</p>
        <button id="startCameraButton" class="primary-button" type="button">カメラを起動</button>
      </div>
    </section>

    <section id="resultScreen" class="screen result-screen hidden">
      <div class="result-card">
        <div class="result-icon">✓</div>
        <p class="eyebrow">SCAN COMPLETE</p>
        <h1>読み取り結果</h1>
        <div class="result-value">
          <span id="resultType" class="result-type">URL</span>
          <div id="resultUrl" class="result-url" title=""></div>
        </div>
        <div class="actions">
          <button id="copyButton" class="secondary-button" type="button">コピー</button>
          <button id="shareButton" class="secondary-button" type="button">共有</button>
          <button id="openButton" class="primary-button open-button" type="button">ブラウザで開く ↗</button>
        </div>
        <button id="rescanButton" class="text-button" type="button">もう一度スキャン</button>
      </div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" crossorigin="anonymous"></script>
  <script src="./app.js"></script>
</body>
</html>
