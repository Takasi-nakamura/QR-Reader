<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Life</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-soft: #f7f8fa;
    --surface-hover: #f1f3f5;

    --text: #111318;
    --text-secondary: #6c727c;
    --text-muted: #9aa0a8;

    --border: #e8eaed;
    --border-strong: #dfe2e6;

    --accent: #111111;
    --accent-soft: #f1f1f1;

    --danger: #e5484d;

    --radius-xs: 10px;
    --radius-sm: 14px;
    --radius-md: 20px;
    --radius-lg: 28px;
    --radius-xl: 34px;

    --shadow: 0 10px 35px rgba(20, 25, 35, 0.06);
    --shadow-hover: 0 15px 45px rgba(20, 25, 35, 0.10);

    --font: "Noto Sans JP", sans-serif;
}

[data-theme="dark"] {
    --bg: #0d0f12;
    --surface: #15181d;
    --surface-soft: #1b1e24;
    --surface-hover: #23272e;

    --text: #f5f6f7;
    --text-secondary: #a7adb7;
    --text-muted: #777e88;

    --border: #292e36;
    --border-strong: #353b45;

    --accent: #ffffff;
    --accent-soft: #292d34;

    --shadow: 0 10px 35px rgba(0,0,0,.25);
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    transition:
        background .25s ease,
        color .25s ease;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    border: 0;
    cursor: pointer;
}

.app {
    width: min(1500px, 100%);
    min-height: 100vh;
    margin: 0 auto;
    padding: 0 28px 40px;
}

/* --------------------------------------------------
   Header
-------------------------------------------------- */

.header {
    height: 82px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    user-select: none;
}

.brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 11px;
    background: var(--accent);
    color: var(--bg);
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: -1px;
}

.brand-name {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -.8px;
}

.header-actions {
    display: flex;
    gap: 8px;
}

.icon-btn {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    background: var(--surface-soft);
    color: var(--text);
    display: grid;
    place-items: center;
    transition: .2s ease;
}

.icon-btn:hover {
    background: var(--surface-hover);
    transform: translateY(-1px);
}

.icon-btn svg {
    width: 18px;
    height: 18px;
}

/* --------------------------------------------------
   Dashboard
-------------------------------------------------- */

.dashboard {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: minmax(430px, 1fr) 430px;
    gap: 20px;
}

.dashboard.clock-top .clock-card {
    grid-column: 1 / 3;
}

.dashboard.clock-left .clock-card {
    grid-column: 1;
    grid-row: 1 / 3;
}

.dashboard.clock-left .assistant-card {
    grid-column: 2;
    grid-row: 1;
}

.dashboard.clock-left .news-card {
    grid-column: 2;
    grid-row: 2;
}

.dashboard.clock-right .clock-card {
    grid-column: 2;
    grid-row: 1 / 3;
}

.dashboard.clock-right .assistant-card {
    grid-column: 1;
    grid-row: 1;
}

.dashboard.clock-right .news-card {
    grid-column: 1;
    grid-row: 2;
}

.card {
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .25s ease;
}

.card:hover {
    box-shadow: var(--shadow-hover);
}

.card-header {
    height: 64px;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.card-title {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 14px;
    font-weight: 700;
}

.card-title svg {
    width: 17px;
}

/* --------------------------------------------------
   Clock
-------------------------------------------------- */

.clock-card {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    padding: 35px;
}

.clock-date {
    font-size: clamp(13px, 1.5vw, 17px);
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: .08em;
    margin-bottom: 30px;
}

.clock-display {
    width: min(950px, 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: clamp(5px, 1vw, 15px);
}

.flip-group {
    display: flex;
    gap: 5px;
}

.separator {
    font-family: Orbitron, sans-serif;
    font-size: clamp(40px, 7vw, 100px);
    font-weight: 500;
    color: var(--text);
    margin-bottom: 4px;
}

.flip-card {
    width: clamp(48px, 8vw, 105px);
    height: clamp(70px, 12vw, 150px);
    perspective: 700px;
    position: relative;
}

.flip-inner {
    width: 100%;
    height: 100%;
    position: relative;
}

.flip-face {
    position: absolute;
    inset: 0;
    background: #050505;
    border-radius: clamp(8px, 1vw, 16px);
    color: white;
    display: grid;
    place-items: center;
    overflow: hidden;

    font-family: Orbitron, monospace;
    font-size: clamp(35px, 6vw, 82px);
    font-weight: 600;

    box-shadow:
        inset 0 1px rgba(255,255,255,.06),
        0 15px 30px rgba(0,0,0,.12);
}

.flip-face::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 1px;
    background: rgba(255,255,255,.15);
}

.flip-card.flip .flip-inner {
    animation: flipDigit .55s cubic-bezier(.4,0,.2,1);
}

@keyframes flipDigit {
    0% {
        transform: rotateX(0);
    }

    50% {
        transform: rotateX(-90deg);
    }

    100% {
        transform: rotateX(0);
    }
}

.clock-location {
    margin-top: 30px;
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--text-muted);
    font-size: 12px;
}

.clock-location svg {
    width: 14px;
}

.clock-mode {
    position: absolute;
    right: 24px;
    top: 20px;
    padding: 8px 12px;
    border-radius: 12px;
    background: var(--surface-soft);
    color: var(--text-secondary);
    font-size: 11px;
}

/* --------------------------------------------------
   Assistant
-------------------------------------------------- */

.assistant-card {
    display: flex;
    flex-direction: column;
}

.assistant-body {
    display: flex;
    flex: 1;
    min-height: 0;
}

.chat-sidebar {
    width: 190px;
    flex-shrink: 0;
    background: var(--surface-soft);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: width .25s ease;
}

.chat-sidebar.collapsed {
    width: 54px;
}

.chat-sidebar.collapsed .chat-list,
.chat-sidebar.collapsed .new-chat span {
    display: none;
}

.new-chat {
    margin: 12px;
    height: 38px;
    border-radius: 12px;
    background: var(--accent);
    color: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 600;
}

.new-chat svg {
    width: 15px;
}

.chat-list {
    padding: 5px 9px 15px;
    overflow: auto;
}

.chat-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text-secondary);
}

.chat-item:hover,
.chat-item.active {
    background: var(--surface-hover);
    color: var(--text);
}

.chat-item-name {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.chat-more {
    opacity: 0;
    padding: 3px;
    border-radius: 6px;
    background: transparent;
    color: inherit;
}

.chat-item:hover .chat-more {
    opacity: 1;
}

.chat-more svg {
    width: 14px;
}

.chat-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.chat-messages {
    flex: 1;
    overflow: auto;
    padding: 20px;
}

.message {
    max-width: 85%;
    margin-bottom: 12px;
}

.message.ai {
    margin-right: auto;
}

.message.user {
    margin-left: auto;
}

.message-bubble {
    padding: 11px 14px;
    border-radius: 15px;
    font-size: 12px;
    line-height: 1.7;
}

.message.ai .message-bubble {
    background: var(--surface-soft);
}

.message.user .message-bubble {
    background: var(--accent);
    color: var(--bg);
}

.chat-input-area {
    padding: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
}

.chat-input {
    min-width: 0;
    flex: 1;
    height: 42px;
    border: 1px solid var(--border);
    border-radius: 13px;
    outline: none;
    padding: 0 13px;
    background: var(--surface-soft);
    color: var(--text);
}

.chat-input:focus {
    border-color: var(--border-strong);
}

.send-btn {
    width: 42px;
    height: 42px;
    border-radius: 13px;
    background: var(--accent);
    color: var(--bg);
    display: grid;
    place-items: center;
}

.send-btn svg {
    width: 17px;
}

/* --------------------------------------------------
   News
-------------------------------------------------- */

.news-card {
    display: flex;
    flex-direction: column;
}

.news-list {
    padding: 0 18px 18px;
    overflow: auto;
}

.news-item {
    display: flex;
    gap: 14px;
    padding: 13px 7px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
}

.news-item:last-child {
    border-bottom: 0;
}

.news-item:hover .news-title {
    text-decoration: underline;
}

.news-time {
    width: 46px;
    flex-shrink: 0;
    color: var(--text-muted);
    font-size: 10px;
    padding-top: 2px;
}

.news-title {
    font-size: 12px;
    line-height: 1.65;
    font-weight: 600;
}

.news-source {
    margin-top: 4px;
    font-size: 10px;
    color: var(--text-muted);
}

/* --------------------------------------------------
   Modal
-------------------------------------------------- */

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.35);
    backdrop-filter: blur(7px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
}

.modal-overlay.active {
    display: flex;
}

.modal {
    width: min(560px, 100%);
    max-height: 90vh;
    overflow: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 28px;
    box-shadow: 0 30px 100px rgba(0,0,0,.2);
    animation: modalIn .2s ease;
}

@keyframes modalIn {
    from {
        opacity: 0;
        transform: translateY(12px) scale(.98);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.modal-header {
    padding: 22px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
}

.modal-title {
    font-size: 16px;
    font-weight: 700;
}

.modal-body {
    padding: 24px;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 18px 24px;
    border-top: 1px solid var(--border);
}

.btn {
    min-height: 40px;
    padding: 0 15px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
}

.btn-primary {
    background: var(--accent);
    color: var(--bg);
}

.btn-secondary {
    background: var(--surface-soft);
    color: var(--text);
}

.btn-danger {
    background: var(--danger);
    color: white;
}

.field {
    margin-bottom: 18px;
}

.field:last-child {
    margin-bottom: 0;
}

.field label {
    display: block;
    margin-bottom: 7px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
}

.field input,
.field select {
    width: 100%;
    height: 43px;
    border: 1px solid var(--border);
    border-radius: 12px;
    outline: none;
    padding: 0 12px;
    background: var(--surface-soft);
    color: var(--text);
}

.field input:focus,
.field select:focus {
    border-color: var(--border-strong);
}

.setting-section {
    padding: 17px 0;
    border-bottom: 1px solid var(--border);
}

.setting-section:first-child {
    padding-top: 0;
}

.setting-section:last-child {
    border-bottom: 0;
}

.setting-heading {
    margin-bottom: 13px;
    font-size: 13px;
    font-weight: 700;
}

/* --------------------------------------------------
   Layout picker
-------------------------------------------------- */

.layout-options {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.layout-option {
    border: 1px solid var(--border);
    background: var(--surface-soft);
    border-radius: 15px;
    padding: 10px;
    cursor: pointer;
}

.layout-option:hover {
    border-color: var(--border-strong);
}

.layout-preview {
    height: 70px;
    display: grid;
    gap: 4px;
}

.layout-preview span {
    background: var(--text);
    opacity: .15;
    border-radius: 5px;
}

.layout-preview.top {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1.4fr 1fr;
}

.layout-preview.top span:first-child {
    grid-column: 1 / 3;
}

.layout-preview.left {
    grid-template-columns: 1fr 1fr;
}

.layout-preview.left span:first-child {
    grid-row: 1 / 3;
}

.layout-preview.right {
    grid-template-columns: 1fr 1fr;
}

.layout-preview.right span:last-child {
    grid-column: 2;
    grid-row: 1 / 3;
}

.layout-name {
    margin-top: 7px;
    text-align: center;
    font-size: 10px;
    color: var(--text-secondary);
}

/* --------------------------------------------------
   Widget selector
-------------------------------------------------- */

.widget-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.widget-option {
    border: 1px solid var(--border);
    background: var(--surface-soft);
    border-radius: 15px;
    padding: 15px;
    cursor: pointer;
}

.widget-option:hover {
    border-color: var(--border-strong);
}

.widget-option svg {
    width: 20px;
    margin-bottom: 8px;
}

.widget-option strong {
    display: block;
    font-size: 12px;
}

.widget-option small {
    display: block;
    margin-top: 4px;
    color: var(--text-muted);
    font-size: 10px;
}

/* --------------------------------------------------
   News detail
-------------------------------------------------- */

.news-detail-title {
    font-size: 19px;
    line-height: 1.55;
    margin-bottom: 8px;
}

.news-detail-meta {
    color: var(--text-muted);
    font-size: 11px;
    margin-bottom: 22px;
}

.news-detail-text {
    font-size: 13px;
    line-height: 2;
    color: var(--text-secondary);
}

.qr-container {
    margin: 25px auto 0;
    width: 150px;
    height: 150px;
    display: grid;
    place-items: center;
}

.qr-container img {
    border-radius: 8px;
}

/* --------------------------------------------------
   Confirm
-------------------------------------------------- */

.confirm-text {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.8;
}

/* --------------------------------------------------
   Toast
-------------------------------------------------- */

.toast {
    position: fixed;
    left: 50%;
    bottom: 25px;
    transform: translate(-50%, 20px);
    padding: 12px 17px;
    border-radius: 13px;
    background: var(--accent);
    color: var(--bg);
    font-size: 12px;
    opacity: 0;
    pointer-events: none;
    transition: .25s ease;
    z-index: 2000;
}

.toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
}

/* --------------------------------------------------
   Mobile
-------------------------------------------------- */

@media (max-width: 900px) {

    .app {
        padding: 0 15px 25px;
    }

    .header {
        height: 70px;
    }

    .dashboard,
    .dashboard.clock-left,
    .dashboard.clock-right {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
    }

    .dashboard .clock-card,
    .dashboard .assistant-card,
    .dashboard .news-card {
        grid-column: 1 !important;
        grid-row: auto !important;
    }

    .clock-card {
        min-height: 420px;
        padding: 25px 12px;
    }

    .clock-date {
        margin-bottom: 25px;
    }

    .chat-sidebar {
        width: 155px;
    }

    .assistant-card,
    .news-card {
        min-height: 390px;
    }
}

@media (max-width: 560px) {

    .brand-name {
        font-size: 18px;
    }

    .brand-mark {
        width: 30px;
        height: 30px;
    }

    .clock-card {
        min-height: 350px;
    }

    .clock-mode {
        display: none;
    }

    .clock-display {
        gap: 4px;
    }

    .flip-group {
        gap: 3px;
    }

    .separator {
        font-size: 35px;
    }

    .chat-sidebar {
        width: 48px;
    }

    .chat-sidebar .chat-list,
    .chat-sidebar .new-chat span {
        display: none;
    }

    .new-chat {
        margin: 10px 7px;
    }

    .layout-options {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="brand">
            <div class="brand-mark">SL</div>
            <div class="brand-name">Smart Life</div>
        </div>

        <div class="header-actions">
            <button class="icon-btn"
                    title="ダッシュボード配置"
                    onclick="openLayoutModal()">
                <i data-lucide="layout-dashboard"></i>
            </button>

            <button class="icon-btn"
                    title="ウィジェット追加"
                    onclick="openWidgetModal()">
                <i data-lucide="plus"></i>
            </button>

            <button class="icon-btn"
                    title="設定"
                    onclick="openSettings()">
                <i data-lucide="settings"></i>
            </button>
        </div>

    </header>


    <!-- ================= DASHBOARD ================= -->

    <main id="dashboard" class="dashboard clock-top">

        <!-- CLOCK -->

        <section class="card clock-card">

            <div class="clock-mode">
                JAPAN / JST
            </div>

            <div id="clockDate" class="clock-date">
                2026年8月23日（日）
            </div>

            <div class="clock-display">

                <div class="flip-group">
                    <div class="flip-card" id="hour1">
                        <div class="flip-inner">
                            <div class="flip-face">2</div>
                        </div>
                    </div>

                    <div class="flip-card" id="hour2">
                        <div class="flip-inner">
                            <div class="flip-face">0</div>
                        </div>
                    </div>
                </div>

                <div class="separator">:</div>

                <div class="flip-group">
                    <div class="flip-card" id="minute1">
                        <div class="flip-inner">
                            <div class="flip-face">0</div>
                        </div>
                    </div>

                    <div class="flip-card" id="minute2">
                        <div class="flip-inner">
                            <div class="flip-face">0</div>
                        </div>
                    </div>
                </div>

                <div class="separator">:</div>

                <div class="flip-group">
                    <div class="flip-card" id="second1">
                        <div class="flip-
